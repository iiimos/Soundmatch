<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SoundMatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Hanken+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app/tokens.css">
<style>
  html, body { margin: 0; height: 100%; background: #08060c; }
  body {
    display: grid; place-items: center; overflow: hidden;
    background:
      radial-gradient(80% 60% at 50% 0%, oklch(0.20 0.05 320) 0%, transparent 60%),
      #08060c;
    font-family: 'Hanken Grotesk', system-ui, sans-serif;
  }
  #stage { transform-origin: center center; }
  /* hide babel-unparsed flash */
  #root:empty::after {
    content: ''; display: block; width: 402px; height: 874px;
    border-radius: 48px; background: #0d0a14;
  }
</style>
</head>
<body>
  <div id="stage"><div id="root"></div></div>

  <!-- React + Babel (pinned) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- data (plain JS) -->
  <script src="app/data.js"></script>

  <!-- components + app (babel) -->
  <script type="text/babel" src="app/ios-frame.jsx"></script>
  <script type="text/babel" src="app/tweaks-panel.jsx"></script>
  <script type="text/babel" src="app/ui.jsx"></script>
  <script type="text/babel" src="app/discover.jsx"></script>
  <script type="text/babel" src="app/screens.jsx"></script>
  <script type="text/babel" src="app/app.jsx"></script>

  <!-- fit device to viewport -->
  <script>
    function fitStage() {
      const s = Math.min((window.innerWidth - 24) / 402, (window.innerHeight - 24) / 874, 1);
      document.getElementById('stage').style.transform = 'scale(' + s + ')';
    }
    window.addEventListener('resize', fitStage);
    fitStage();
  </script>
</body>
</html>
